<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Minha Memória</title>
  <link rel="icon" type="image/jpeg" href="https://mulheralemdamae.com.br/wp-content/uploads/2023/02/papel-de-parede-para-celular-feminino-rosa.jpg">
  <link rel="apple-touch-icon" href="https://mulheralemdamae.com.br/wp-content/uploads/2023/02/papel-de-parede-para-celular-feminino-rosa.jpg">

  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
      margin: 0;
      line-height: 1.6;
      background-image: url('https://mulheralemdamae.com.br/wp-content/uploads/2023/02/papel-de-parede-para-celular-feminino-rosa.jpg');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      background-attachment: fixed;
      min-height: 100vh;
    }

    .container {
      max-width: 600px;
      margin: 0 auto;
      background-color: rgba(255, 255, 255, 0.9);
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.15);
    }

    h1 {
      text-align: center;
      color: #333;
      margin-top: 0;
    }

    .form-group {
      margin-bottom: 15px;
    }

    label {
      display: block;
      margin-bottom: 5px;
      font-weight: bold;
      color: #444;
    }

    input[type="text"], textarea {
      width: 100%;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 6px;
      box-sizing: border-box;
      font-size: 16px;
    }

    textarea {
      resize: vertical;
      height: 100px;
    }

    button {
      width: 100%;
      padding: 12px;
      background-color: #d87093;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    button:hover {
      background-color: #c75b80;
    }

    .memory-card {
      background-color: #fff;
      border-left: 4px solid #d87093;
      padding: 15px;
      margin-top: 15px;
      border-radius: 6px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.05);
      position: relative;
    }

    .memory-card h3 {
      margin: 0 0 5px 0;
      color: #333;
    }

    .memory-card p {
      margin: 0;
      color: #666;
      white-space: pre-wrap;
    }

    .memory-card .date {
      font-size: 12px;
      color: #999;
      margin-top: 8px;
    }

    .delete-btn {
      position: absolute;
      top: 10px;
      right: 10px;
      background: none;
      border: none;
      color: #ff4d4d;
      font-size: 14px;
      cursor: pointer;
      width: auto;
      padding: 0;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>Minha Memória</h1>
    
    <div class="form-group">
      <label for="title">Título:</label>
      <input type="text" id="title" placeholder="Digite um título...">
    </div>

    <div class="form-group">
      <label for="content">Memória:</label>
      <textarea id="content" placeholder="Escreva aqui sua memória..."></textarea>
    </div>

    <button onclick="saveMemory()">Salvar Memória</button>

    <div id="memories-list"></div>
  </div>

  <script>
    function loadMemories() {
      const memories = JSON.parse(localStorage.getItem('memories')) || [];
      const listElement = document.getElementById('memories-list');
      listElement.innerHTML = '';

      memories.forEach((memory, index) => {
        const card = document.createElement('div');
        card.className = 'memory-card';
        card.innerHTML = `
          <button class="delete-btn" onclick="deleteMemory(${index})">Excluir</button>
          <h3>${memory.title}</h3>
          <p>${memory.content}</p>
          <div class="date">${memory.date}</div>
        `;
        listElement.appendChild(card);
      });
    }

    function saveMemory() {
      const titleInput = document.getElementById('title');
      const contentInput = document.getElementById('content');

      if (!titleInput.value.trim() || !contentInput.value.trim()) {
        alert('Por favor, preencha o título e o conteúdo!');
        return;
      }

      const memories = JSON.parse(localStorage.getItem('memories')) || [];
      const newMemory = {
        title: titleInput.value,
        content: contentInput.value,
        date: new Date().toLocaleDateString('pt-BR') + ' às ' + new Date().toLocaleTimeString('pt-BR', {hour: '2-digit', minute:'2-digit'})
      };

      memories.unshift(newMemory);
      localStorage.setItem('memories', JSON.stringify(memories));

      titleInput.value = '';
      contentInput.value = '';

      loadMemories();
    }

    function deleteMemory(index) {
      const memories = JSON.parse(localStorage.getItem('memories')) || [];
      memories.splice(index, 1);
      localStorage.setItem('memories', JSON.stringify(memories));
      loadMemories();
    }

    window.onload = loadMemories;
  </script>

</body>
</html>
